<div class="cart-container">
  <h2>🛒 Shopping Cart Summary</h2>
  
  <div class="cart-items">
    @for (item of martService.cart(); track $index) {
      <div class="cart-row">
        <span>{{ item.image }} {{ item.name }}</span>
        <span class="item-price">₱{{ item.price }}</span>
        <button class="remove-btn" (click)="martService.removeFromCart($index)">Remove</button>
      </div>
    } @empty {
      <p class="empty-msg">Your PokéMart shopping cart is currently empty.</p>
    }
  </div>

  <hr />

  <div class="cart-summary">
    <h3>Total Amount: <span>₱{{ martService.totalPrice() }}</span></h3>
    <button class="clear-btn" (click)="martService.clearCart()" [disabled]="martService.cart().length === 0">
      Clear Cart / Checkout
    </button>
  </div>
</div>
